<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="AnestesioQuest: juego de farmacología para anestesiología con 182 fármacos, casos clínicos y duelos multijugador."><meta name="theme-color" content="#0f1117"></head><body>
<title>AnestesioQuest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior fija, categorías a la izquierda (fila deslizable en móvil), contenido en una columna de lectura */
:root {
  color-scheme: dark;
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --surface3: #2b3048;
  --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.18);
  --accent: #58cc02; --accent-dark: #46a302; --accent-soft: rgba(88,204,2,0.14);
  --red: #ff4b4b; --red-soft: rgba(255,75,75,0.14);
  --blue: #1cb0f6; --blue-soft: rgba(28,176,246,0.14);
  --purple: #ce82ff; --purple-soft: rgba(206,130,255,0.14);
  --gold: #ffc800; --gold-soft: rgba(255,200,0,0.14);
  --orange: #ff9600; --orange-soft: rgba(255,150,0,0.14);
  --text: #e8eaf0; --text2: #b4b9c8; --muted: #7c8396;
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; font-size: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
input, select { font-family: inherit; font-size: 16px; color: var(--text); }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); border-bottom: 2px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, var(--accent), var(--blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tab { padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--muted); border: 2px solid transparent; min-height: 40px; }
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.on { color: var(--accent); background: var(--accent-soft); border-color: rgba(88,204,2,0.3); }
.stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 2px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.pill.xp { color: var(--gold); border-color: rgba(255,200,0,0.3); }
.pill.streak { color: var(--orange); border-color: rgba(255,150,0,0.3); }
.pill.lvl { color: var(--purple); border-color: rgba(206,130,255,0.3); }

/* Estructura */
.app { display: flex; align-items: flex-start; max-width: 1240px; margin: 0 auto; }
.side { width: 264px; flex-shrink: 0; padding: 16px 10px; position: sticky; top: 62px; max-height: calc(100vh - 62px); overflow-y: auto; border-right: 2px solid var(--border); }
.side-title { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 6px 12px; }
.cat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 12px; border: 2px solid transparent; font-weight: 700; font-size: 14px; color: var(--text2); min-height: 44px; }
.cat:hover { background: var(--surface2); color: var(--text); }
.cat.on { background: var(--accent-soft); border-color: rgba(88,204,2,0.3); color: var(--accent); }
.cat .ic { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.cat .nm { flex: 1; min-width: 0; }
.cat .ct { font-size: 11px; font-weight: 800; background: var(--surface2); border-radius: 10px; padding: 2px 7px; color: var(--muted); }
.cat .mini { display: block; height: 3px; border-radius: 2px; background: var(--surface3); margin-top: 4px; overflow: hidden; }
.cat .mini i { display: block; height: 100%; background: var(--accent); }
.main { flex: 1; min-width: 0; padding-block: 24px 80px; padding-inline: 24px; }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.screen { animation: up 0.2s ease; }
@keyframes up { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Cabeceras */
.hd h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
.hd p { color: var(--text2); font-weight: 600; font-size: 15px; margin-top: 4px; }
.sec-title { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.bar { height: 10px; border-radius: 6px; background: var(--surface3); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #89e219); border-radius: 6px; transition: width 0.4s; }

/* Tarjetas de modo */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mode { text-align: left; background: var(--surface); border: 2px solid var(--border); border-bottom-width: 4px; border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 4px; transition: transform 0.12s, border-color 0.12s; position: relative; }
.mode:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.mode:active { transform: translateY(1px); border-bottom-width: 2px; }
.mode .mi { font-size: 30px; line-height: 1; margin-bottom: 4px; }
.mode .mt { font-size: 16px; font-weight: 900; }
.mode .md { font-size: 13px; color: var(--text2); font-weight: 600; line-height: 1.45; }
.mode .mb { position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
.mode.g { border-color: rgba(88,204,2,0.32); } .mode.g .mb { background: var(--accent-soft); color: var(--accent); }
.mode.b { border-color: rgba(28,176,246,0.32); } .mode.b .mb { background: var(--blue-soft); color: var(--blue); }
.mode.p { border-color: rgba(206,130,255,0.32); } .mode.p .mb { background: var(--purple-soft); color: var(--purple); }
.mode.y { border-color: rgba(255,200,0,0.32); } .mode.y .mb { background: var(--gold-soft); color: var(--gold); }
.mode.r { border-color: rgba(255,75,75,0.32); } .mode.r .mb { background: var(--red-soft); color: var(--red); }
.mode.o { border-color: rgba(255,150,0,0.32); } .mode.o .mb { background: var(--orange-soft); color: var(--orange); }
.mode[disabled] { opacity: 0.5; cursor: not-allowed; }
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

/* Juego */
.gh { display: flex; align-items: center; gap: 12px; }
.x { width: 44px; height: 44px; border-radius: 12px; font-size: 18px; font-weight: 900; color: var(--muted); border: 2px solid var(--border); flex-shrink: 0; }
.x:hover { color: var(--text); background: var(--surface2); }
.gh .bar { flex: 1; height: 14px; }
.hearts { font-size: 15px; font-weight: 800; color: var(--red); white-space: nowrap; }
.timer { font-family: var(--mono); font-weight: 500; color: var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 4px 10px; font-size: 15px; }
.qlabel { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blue); }
.qtext { font-size: 22px; font-weight: 800; line-height: 1.35; text-wrap: pretty; }
.qsub { background: var(--surface); border: 2px solid var(--border); border-left: 4px solid var(--blue); border-radius: 12px; padding: 14px 16px; font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.55; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--border); border-bottom-width: 4px; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 15px; line-height: 1.45; min-height: 52px; transition: background 0.1s, border-color 0.1s; display: flex; gap: 12px; align-items: flex-start; }
.opt .k { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 2px solid var(--border); border-radius: 8px; width: 26px; height: 26px; display: grid; place-items: center; flex-shrink: 0; }
.opt:hover:not([disabled]) { background: var(--surface2); border-color: var(--border-strong); }
.opt[disabled] { cursor: default; }
.opt.ok { background: var(--accent-soft); border-color: var(--accent); color: #c9f5a0; }
.opt.bad { background: var(--red-soft); border-color: var(--red); color: #ffc2c2; }
.opt.mid { background: var(--gold-soft); border-color: var(--gold); color: #ffe89a; }
.opt.sel { background: var(--blue-soft); border-color: var(--blue); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .opt { justify-content: center; font-size: 17px; font-weight: 900; }
.inrow { display: flex; gap: 10px; flex-wrap: wrap; }
.txt { flex: 1; min-width: 180px; background: var(--surface); border: 2px solid var(--border-strong); border-radius: 14px; padding: 14px 16px; font-weight: 700; }
.btn { background: var(--accent); color: #0f1117; font-weight: 900; border-radius: 14px; padding: 13px 22px; border-bottom: 4px solid var(--accent-dark); font-size: 15px; letter-spacing: 0.3px; min-height: 48px; }
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.sec { background: var(--surface2); color: var(--text); border: 2px solid var(--border-strong); border-bottom-width: 4px; }
.btn.blue { background: var(--blue); border-bottom-color: #0d8fc2; }
.btn.sm { padding: 8px 14px; font-size: 13px; min-height: 40px; border-radius: 11px; }
.btn.danger { background: var(--red-soft); color: var(--red); border: 2px solid rgba(255,75,75,0.4); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Panel de respuesta */
.fb { border-radius: var(--r); border: 2px solid var(--border); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.fb.ok { border-color: rgba(88,204,2,0.5); } .fb.bad { border-color: rgba(255,75,75,0.5); }
.fb h3 { font-size: 18px; font-weight: 900; }
.fb.ok h3 { color: var(--accent); } .fb.bad h3 { color: var(--red); }
.fb p { font-size: 15px; font-weight: 600; color: var(--text); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; padding-top: 2px; }
.kv dd { font-weight: 600; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.pearl { background: var(--gold-soft); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; color: #ffe89a; }
.ai { background: var(--surface2); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600; white-space: pre-wrap; line-height: 1.6; }
.note { font-size: 12px; color: var(--muted); font-weight: 600; }

/* Conectar / memoria / ordenar */
.match { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.match .opt { font-size: 14px; min-height: 60px; align-items: center; }
.opt.done { opacity: 0.45; border-style: dashed; }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.card { aspect-ratio: 1 / 1.05; border-radius: 14px; border: 2px solid var(--border); border-bottom-width: 4px; background: var(--surface2); font-weight: 800; font-size: 12.5px; line-height: 1.3; padding: 6px; display: grid; place-items: center; text-align: center; overflow: hidden; overflow-wrap: anywhere; }
.card.back { font-size: 26px; color: var(--muted); }
.card.up { background: var(--surface); border-color: var(--blue); }
.card.up.dr { color: var(--gold); font-size: 14px; }
.card.hit { background: var(--accent-soft); border-color: var(--accent); }
.ord { display: grid; gap: 8px; }
.oi { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 15px; }
.oi .n { font-family: var(--mono); color: var(--muted); width: 22px; }
.oi .tx { flex: 1; min-width: 0; }
.oi button { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--border); font-weight: 900; }
.oi button:hover:not([disabled]) { background: var(--surface2); }
.oi button[disabled] { opacity: 0.25; }
.oi.ok { border-color: var(--accent); background: var(--accent-soft); } .oi.bad { border-color: var(--red); background: var(--red-soft); }

/* Flashcard */
.fc { background: var(--surface); border: 2px solid var(--border-strong); border-bottom-width: 5px; border-radius: 20px; padding: 28px 22px; min-height: 280px; display: flex; flex-direction: column; gap: 14px; justify-content: center; text-align: center; width: 100%; }
.fc .nm { font-size: 30px; font-weight: 900; }
.fc.open { text-align: left; justify-content: flex-start; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { padding: 12px 6px; border-radius: 12px; font-weight: 800; font-size: 13px; border: 2px solid var(--border); border-bottom-width: 4px; background: var(--surface); min-height: 52px; }

/* Casos */
.vig { background: var(--surface); border: 2px solid var(--border); border-left: 4px solid var(--purple); border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 600; line-height: 1.6; }
.clist { display: grid; gap: 10px; }
.citem { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; min-height: 60px; }
.citem:hover { border-color: var(--border-strong); background: var(--surface2); }
.citem .tt { flex: 1; min-width: 0; font-weight: 800; }
.citem .tt small { display: block; font-weight: 700; color: var(--muted); font-size: 12px; }
.chip { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 9px; background: var(--surface3); color: var(--text2); white-space: nowrap; }
.chip.g { background: var(--accent-soft); color: var(--accent); } .chip.y { background: var(--gold-soft); color: var(--gold); } .chip.r { background: var(--red-soft); color: var(--red); } .chip.b { background: var(--blue-soft); color: var(--blue); } .chip.p { background: var(--purple-soft); color: var(--purple); }

/* Resultados */
.res { text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; }
.res .tr { font-size: 64px; line-height: 1; }
.res h1 { font-size: 30px; font-weight: 900; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; width: 100%; }
.tile { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; }
.tile b { display: block; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }
.rev { text-align: left; width: 100%; display: grid; gap: 8px; }
.rev details { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.rev summary { cursor: pointer; font-weight: 800; }
.rev p { margin-top: 8px; color: var(--text2); }

/* Fichas */
.filters { display: flex; gap: 10px; flex-wrap: wrap; }
.filters input, .filters select { background: var(--surface); border: 2px solid var(--border-strong); border-radius: 12px; padding: 11px 14px; font-weight: 700; min-height: 48px; }
.filters input { flex: 1; min-width: 200px; }
.dlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.dcard { text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 86px; }
.dcard:hover { border-color: var(--border-strong); background: var(--surface2); }
.dcard b { font-size: 16px; font-weight: 900; }
.dcard small { color: var(--text2); font-weight: 600; font-size: 12.5px; line-height: 1.35; }
.dcard .bar { height: 5px; margin-top: auto; }
.ficha { display: flex; flex-direction: column; gap: 16px; }
.ficha h1 { font-size: 30px; font-weight: 900; }
.fsec { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.fsec h3 { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
.fsec p, .fsec li { font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--text); max-width: 70ch; }
.fsec ul { list-style: none; display: grid; gap: 4px; }
.fsec li b { color: var(--gold); font-weight: 800; }
.fsec.upd { border-color: rgba(206,130,255,0.4); } .fsec.upd h3 { color: var(--purple); }
.fsec.warn { border-color: rgba(255,75,75,0.35); } .fsec.warn h3 { color: var(--red); }
.cmp { overflow-x: auto; border: 2px solid var(--border); border-radius: 14px; }
.cmp table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
.cmp th, .cmp td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; font-weight: 600; }
.cmp th { background: var(--surface2); font-weight: 900; }
.cmp td:first-child { color: var(--muted); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; width: 130px; }

/* Progreso */
.catbars { display: grid; gap: 8px; }
.cb { display: grid; grid-template-columns: minmax(120px, 230px) 1fr 44px; gap: 12px; align-items: center; font-size: 14px; font-weight: 700; text-align: left; padding: 4px 0; }
.cb .pc { font-family: var(--mono); text-align: right; color: var(--text2); font-size: 13px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bdg { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; opacity: 0.4; }
.bdg.on { opacity: 1; border-color: rgba(255,200,0,0.45); }
.bdg .e { font-size: 28px; } .bdg b { display: block; font-size: 13px; font-weight: 900; } .bdg small { font-size: 11.5px; color: var(--text2); font-weight: 600; line-height: 1.3; display: block; }

[hidden] { display: none !important; }
.ov { position: fixed; inset: 0; background: rgba(5,6,10,0.78); z-index: 80; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 40px; }
.ovin { max-width: 820px; margin: 0 auto; background: var(--bg); border: 2px solid var(--border-strong); border-radius: 20px; padding: 20px; }
.board { display: grid; gap: 6px; }
.brow { display: grid; grid-template-columns: 22px 1fr auto 64px; gap: 10px; align-items: center; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 14px; }
.brow.me { border-color: rgba(88,204,2,0.55); background: var(--accent-soft); }
.brow .bn { min-width: 0; overflow-wrap: anywhere; } .brow .bp { color: var(--text2); font-size: 12px; white-space: nowrap; } .brow .bs { text-align: right; color: var(--gold); font-size: 15px; }
.board.compact .brow { padding: 5px 10px; font-size: 13px; }
.dsel { background: var(--surface); border: 2px solid var(--border-strong); border-radius: 12px; padding: 10px 12px; font-weight: 700; min-height: 46px; max-width: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 80px); background: var(--gold); color: #0f1117; font-weight: 900; padding: 10px 20px; border-radius: 20px; z-index: 99; transition: transform 0.25s, opacity 0.25s; opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 880px) {
  .app { flex-direction: column; }
  .side { width: 100%; position: static; max-height: none; border-right: 0; border-bottom: 2px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; }
  .side-title { display: none; }
  .cat { width: auto; flex-shrink: 0; padding: 8px 12px; }
  .cat .nm { white-space: nowrap; } .cat .mini { display: none; }
  .main { padding-inline: 16px; padding-block: 18px 80px; width: 100%; }
  .tabs { order: 3; width: 100%; margin-left: 0; }
  .pill.lvl { display: none; }
  .tab { flex: 1; }
  .qtext { font-size: 19px; }
  .hd h1 { font-size: 23px; }
  .kv { grid-template-columns: 1fr; gap: 0 0; } .kv dd { margin-bottom: 8px; }
  .match { grid-template-columns: 1fr 1.2fr; gap: 8px; } .match .opt { font-size: 12.5px; padding: 10px; }
  .mem { gap: 6px; } .card { font-size: 10.5px; padding: 4px; }
  .rate { grid-template-columns: repeat(2, 1fr); }
  .cb { grid-template-columns: 1fr 70px 40px; }
}

// ===================== Sonido (WebAudio sintetizado, sin archivos externos) =====================
const SND = (() => {
  let ctx = null, master = null, musicG = null, timer = null, nextT = 0, step = 0;
  let muted = false, wantMusic = false, playing = false;
  try { muted = localStorage.getItem("aq_mute") === "1"; } catch (e) {}
  const EIGHTH = 0.3; // 100 BPM, corcheas
  // progresión suave: Am · F · C · G (cada acorde dura un compás de 8 corcheas)
  const PROG = [
    { root: 110.00, notes: [220.00, 261.63, 329.63] },
    { root: 87.31, notes: [174.61, 220.00, 261.63] },
    { root: 130.81, notes: [261.63, 329.63, 392.00] },
    { root: 98.00, notes: [246.94, 293.66, 392.00] }
  ];
  const ARP = [0, 1, 2, 1, 0, 2, 1, 2];

  function ac() {
    if (ctx) return ctx;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try {
      ctx = new C();
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ctx.destination);
      musicG = ctx.createGain(); musicG.gain.value = 0.55; musicG.connect(master);
    } catch (e) { ctx = null; }
    return ctx;
  }
  function tone(freq, t0, dur, type, vol, dest, slideTo) {
    const c = ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function play(fn) { const c = ac(); if (!c || muted) return; if (c.state === "suspended") c.resume().catch(() => {}); fn(c.currentTime + 0.01); }

  // ---- efectos ----
  const sfx = {
    ok(t) { [1046.5, 1318.5, 1568].forEach((f, i) => tone(f, t + i * 0.085, 0.22, "triangle", 0.22)); },
    bad(t) { tone(300, t, 0.34, "triangle", 0.2, null, 150); tone(152, t + 0.02, 0.3, "sine", 0.12); },
    botOk(t) { tone(1174.7, t, 0.12, "sine", 0.07); },
    botBad(t) { tone(330, t, 0.16, "sine", 0.05, null, 260); },
    tick(t) { tone(1000, t, 0.05, "square", 0.04); },
    go(t) { [523.25, 783.99].forEach((f, i) => tone(f, t + i * 0.09, 0.3, "triangle", 0.2)); },
    win(t) { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * 0.11, 0.42, "triangle", 0.2)); },
    lose(t) { [392, 349.23, 311.13, 261.63].forEach((f, i) => tone(f, t + i * 0.16, 0.36, "sine", 0.17)); }
  };

  // ---- música de fondo (bucle generado) ----
  function playStep(s, t) {
    const bar = Math.floor(s / 8) % PROG.length, idx = s % 8, ch = PROG[bar];
    if (idx === 0) ch.notes.forEach(f => {
      const c = ctx, o = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
      o.type = "sawtooth"; o.frequency.value = f; o.detune.value = (Math.random() - 0.5) * 8;
      lp.type = "lowpass"; lp.frequency.value = 780; lp.Q.value = 0.5;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.028, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + EIGHTH * 8);
      o.connect(lp); lp.connect(g); g.connect(musicG); o.start(t); o.stop(t + EIGHTH * 8 + 0.05);
    });
    if (idx === 0 || idx === 4) tone(ch.root, t, EIGHTH * 1.8, "sine", 0.1, musicG);
    if (idx % 2 === 0) tone(ch.notes[ARP[idx]] * 2, t, EIGHTH * 0.9, "triangle", 0.045, musicG);
    else tone(ch.notes[ARP[idx]] * 2, t, EIGHTH * 0.5, "triangle", 0.03, musicG);
    if (idx % 2 === 0) tone(1500, t, 0.03, "square", 0.012, musicG);
  }
  function sched() {
    const c = ctx; if (!c) return;
    while (nextT < c.currentTime + 0.25) { playStep(step, nextT); nextT += EIGHTH; step++; }
  }
  function startMusic() {
    const c = ac(); if (!c || muted || playing) return;
    if (c.state === "suspended") c.resume().catch(() => {});
    playing = true; musicG.gain.cancelScheduledValues(c.currentTime); musicG.gain.setTargetAtTime(0.55, c.currentTime, 0.2);
    nextT = c.currentTime + 0.12; step = 0; sched(); timer = setInterval(sched, 60);
  }
  function stopMusic() {
    if (!playing) return;
    playing = false; clearInterval(timer); timer = null;
    if (ctx) musicG.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
  }
  function setMusic(on) { wantMusic = !!on; if (wantMusic) startMusic(); else stopMusic(); }

  function syncLabel() { const b = document.getElementById("snd"); if (b) { b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-label", muted ? "Activar sonido" : "Silenciar"); b.setAttribute("aria-pressed", String(!muted)); } }
  function toggle() {
    muted = !muted;
    try { localStorage.setItem("aq_mute", muted ? "1" : "0"); } catch (e) {}
    if (ac()) master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.05);
    if (muted) stopMusic(); else { if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {}); if (wantMusic) startMusic(); }
    syncLabel();
  }
  // Los navegadores exigen un gesto del usuario para sonar: desbloqueamos en el primer toque
  function unlock() { ac(); if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {}); if (wantMusic && !playing) startMusic(); }
  document.addEventListener("pointerdown", unlock, true);
  document.addEventListener("keydown", unlock, true);

  return {
    get muted() { return muted; },
    toggle, syncLabel, unlock, setMusic,
    ans: ok => play(t => (ok ? sfx.ok(t) : sfx.bad(t))),
    opp: (ok, bot) => play(t => (bot ? (ok ? sfx.botOk(t) : sfx.botBad(t)) : (ok ? sfx.ok(t) : sfx.bad(t)))),
    tick: () => play(sfx.tick), go: () => play(sfx.go),
    win: () => play(sfx.win), lose: () => play(sfx.lose)
  };
})();

let rnd = Math.random;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(rnd() * a.length)];

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const STRICT = ["usos", "pd", "ind", "ci", "ea", "int"];
const ALLQ = [...SHORT, ...PAIR, ...LONG];
const GENERIC = /^(sin cambios|ninguna|ninguno|hipersensibilidad|como |las de|las mismas|los mismos|pocas|uso |aditiv|similar|otros |disponibilidad|practicamente)/;
const askRev = (d, k) => d[k] && d[k].length >= 28 && !GENERIC.test(norm(d[k]));
const BYID = {};
DB.forEach(d => {
  d.id = norm(d.n).replace(/ /g, "-"); BYID[d.id] = d;
  d.dos = pairs(d.dosis); d.pkl = pairs(d.pk);
  d.als = [d.n, ...(d.al || "").split(",")].map(norm).filter(Boolean);
  d.base = norm(d.n).split(" ")[0];
  d.q = ALLQ.filter(k => LONG.includes(k) ? askRev(d, k) : true);
});
DB.forEach(d => { d.dup = /adyuvante|perineural|baja dosis|antiarritmica| iv$/.test(norm(d.n)); });
const catOf = id => CATS.find(c => c.id === id);

function mask(d, text) {
  const words = [d.n, ...(d.al || "").split(","), d.n.split(" ")[0]].filter(w => w && w.length >= 4).sort((a, b) => b.length - a.length);
  let t = text;
  words.forEach(w => { t = t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "giu"), "▢▢▢"); });
  return t;
}
const toks = s => norm(s).split(" ").filter(w => w.length > 2 && !/^\d+$/.test(w));
function similar(a, b) {
  if (norm(a) === norm(b)) return true;
  const A = new Set(toks(a)), B = new Set(toks(b));
  if (A.size < 3 || B.size < 3) return false;
  let i = 0; A.forEach(x => { if (B.has(x)) i++; });
  if (i === A.size || i === B.size) return true;
  return i / (A.size + B.size - i) > 0.6;
}

const DEF = () => ({ v: 2, xp: 0, streak: { n: 0, last: 0 }, cards: {}, st: { a: 0, c: 0 }, best: { cr: 0, sv: 0, mem: 0 }, bad: {}, daily: { day: 0, n: 0 }, cases: {}, exams: [], boss: {}, sessions: 0, t: 0 });

function save() {
  P.t = Date.now();

  if (cloudDoc) { cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 4000); }

async function pushCloud() {
  if (!cloudDoc || cloudBusy || !cloudDirty) return;
  cloudBusy = true; cloudDirty = false;
  try { await cloudDoc.set({ json: JSON.stringify(P), t: P.t }); cloudOn = true; }
  catch (e) { if (e && e.code === "invalid_argument") { cloudDoc = null; cloudOn = false; } else cloudDirty = true; }

async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudDoc = db.collection("data/users/" + id).doc("progreso");
    const snap = await cloudDoc.get(); const r = snap.exists ? snap.data() : null;
    cloudOn = true;
    if (r && r.json && r.t > P.t) {
      P = Object.assign(DEF(), JSON.parse(r.json));
      try { localStorage.setItem("aq2", JSON.stringify(P)); } catch (e) {}

    } else if (P.t > (r ? r.t : 0)) { cloudDirty = true; pushCloud(); }

}

const LEVELS = [[0, "Interno"], [500, "R1"], [1500, "R2"], [3500, "R3"], [7000, "Adjunto"], [12000, "Jefe de servicio"]];

const IV = [0, 1, 3, 7, 14, 30];
function grade(key, ok) {
  const c = P.cards[key] || [0, 0];
  if (ok) { c[0] = Math.min(5, c[0] + 1); c[1] = today() + IV[c[0]]; } else { c[0] = 1; c[1] = today(); }

}
const box = key => (P.cards[key] || [0])[0];
const mastery = d => d.q.reduce((n, k) => n + (box(d.id + "|" + k) >= 2 ? 1 : 0), 0) / d.q.length;

function dueCards(p) {

  for (const key in P.cards) { const c = P.cards[key]; const [id, k] = key.split("|"); if (c[1] <= t && ids.has(id) && k !== "fc") out.push(key); }

}
function touchStreak() {

  P.streak.n = P.streak.last === t - 1 ? P.streak.n + 1 : 1; P.streak.last = t;

// ---------- generación de preguntas ----------
function distract(correct, d, get, fallback) {
  const out = [];
  const add = (list, fn) => { for (const v of shuffle(list.flatMap(fn))) { if (out.length >= 3) return; if (!v || similar(v, correct) || out.some(o => similar(o, v))) continue; out.push(v); } };
  const same = DB.filter(x => x !== d && x.c === d.c), rest = DB.filter(x => x.c !== d.c);
  add(same, get); if (out.length < 3) add(rest, get);
  if (fallback && out.length < 3) { add(same, fallback); if (out.length < 3) add(rest, fallback); }
  return out;
}
function makeQ(d, k) {
  const key = d.id + "|" + k;
  if (SHORT.includes(k) && !(k === "sig" && rnd() < 0.4 && askRev(d, "sig"))) {
    const cv = d[k], o = distract(cv, d, x => [x[k]]); if (o.length < 3) return null;
    const opts = shuffle([cv, ...o]);
    return { type: "mcq", label: F[k][0], prompt: F[k][1].replace("{n}", d.n), opts, ans: opts.indexOf(cv), d, key };
  }
  if (PAIR.includes(k)) {
    const all = k === "dosis" ? d.dos : d.pkl, desc = all.filter(y => toks(y[1]).length >= 3), prs = k === "pk" && desc.length ? desc : all, [lab, cv] = pick(prs), pl = x => k === "dosis" ? x.dos : x.pkl;
    const o = distract(cv, d, x => pl(x).filter(y => norm(y[0]) === norm(lab)).map(y => y[1]), x => pl(x).map(y => y[1]));
    if (o.length < 3) return null;
    const opts = shuffle([cv, ...o]);
    return { type: "mcq", label: F[k][0], prompt: (k === "dosis" ? "Dosis de " : "Farmacocinética de ") + d.n, sub: lab, opts, ans: opts.indexOf(cv), d, key };
  }
  if (!askRev(d, k)) return null;
  const cv = d[k], strict = STRICT.includes(k);
  const okD = x => x !== d && x.base !== d.base && !(strict && norm(x.g) === norm(d.g)) && !(x[k] && similar(x[k], cv));
  let c = shuffle(DB.filter(x => x.c === d.c && okD(x))).slice(0, 3);
  if (c.length < 3) c = c.concat(shuffle(DB.filter(x => x.c !== d.c && okD(x))).slice(0, 3 - c.length));
  if (c.length < 3) return null;
  const opts = shuffle([d.n, ...c.map(x => x.n)]);
  return { type: "mcq", label: F[k][0], prompt: "¿A qué fármaco corresponde?", sub: mask(d, cv), opts, ans: opts.indexOf(d.n), d, key, rev: true };
}
function sampleW(p, n) {
  const a = p.map(d => ({ d, w: (1.6 - mastery(d)) * rnd() })).sort((x, y) => y.w - x.w).map(x => x.d);
  const out = []; while (out.length < n) out.push(...a); return out.slice(0, n);
}
function pickField(d, allowed) {
  const ks = d.q.filter(k => !allowed || allowed.includes(k)), weak = ks.filter(k => box(d.id + "|" + k) < 2);
  return pick(weak.length && rnd() < 0.75 ? weak : ks);
}
function genMixed(p, n, allowed) {
  const out = [];
  for (const d of sampleW(p, n)) { let q = null; for (let t = 0; t < 5 && !q; t++) q = makeQ(d, pickField(d, allowed)); if (q) out.push(q); }
  return out;
}
function genTF(p, n) {
  const out = [], bank = shuffle(TF_BANK); let bi = 0;
  for (const d of sampleW(p, n * 3)) {
    if (out.length >= n) break;
    if (V.cat === "all" && rnd() < 0.4 && bi < bank.length) { const b = bank[bi++]; out.push({ type: "tf", label: "Verdadero o falso", prompt: b[0], ans: b[1], exp: b[2] }); continue; }
    const k = pick(SHORT), truth = rnd() < 0.5; let v = d[k];
    if (!truth) { const o = distract(v, d, x => [x[k]]); if (!o.length) continue; v = o[0]; }
    out.push({ type: "tf", label: "Verdadero o falso", prompt: `${d.n} — ${F[k][0].toLowerCase()}:`, sub: v, ans: truth, d, key: d.id + "|" + k, exp: truth ? "" : `Lo correcto para ${d.n}: ${d[k]}` });
  }
  return out;
}
function genFill(p, n) {
  return sampleW(p.filter(d => !d.dup), n).map(d => ({ type: "fill", label: "Completar", prompt: "Escribe el nombre del fármaco", clues: [["Grupo", d.g], ["Mecanismo", mask(d, d.ma)], ["Rasgo", mask(d, d.sig)]], accept: d.als, answer: d.n, d, key: d.id + "|ma", xp: 15 }));
}
function genQuien(p, n) {
  return sampleW(p.filter(d => !d.dup), n).map(d => {
    const c = shuffle(DB.filter(x => x !== d && x.c === d.c && x.base !== d.base && !x.dup)).slice(0, 3);
    const opts = shuffle([d.n, ...c.map(x => x.n)]);
    return { type: "quien", label: "¿Quién soy?", prompt: "Adivina con el menor número de pistas", clues: [["Grupo", d.g], ["Receptor o diana", d.rec], ["Familia", mask(d, d.f)], ["Rasgo", mask(d, d.sig)], ["Perla", mask(d, d.perla)]], opts, ans: opts.indexOf(d.n), d, key: d.id + "|sig" };
  });
}
function genClass(n) {
  const out = [];
  for (const s of shuffle(CLASS_SETS)) {
    const bs = Object.keys(s.b);
    for (const b of bs) for (const it of s.b[b]) out.push({ type: "mcq", label: "Clasificar", prompt: s.t, sub: it, opts: bs, ans: bs.indexOf(b), exp: s.exp, d: DB.find(x => x.n === it) });
  }
  return shuffle(out).slice(0, n);
}
function genIntruso(n) {
  const out = [];
  for (let t = 0; t < n * 3 && out.length < n; t++) {
    const s = pick(CLASS_SETS), bs = Object.keys(s.b).filter(b => s.b[b].length >= 3); if (!bs.length) continue;
    const A = pick(bs), others = Object.keys(s.b).filter(b => b !== A), B = pick(others);
    const three = shuffle(s.b[A]).slice(0, 3), odd = pick(s.b[B]), opts = shuffle([...three, odd]);
    out.push({ type: "mcq", label: "Encuentra el intruso", prompt: "Tres comparten una característica. ¿Cuál no?", sub: s.t, opts, ans: opts.indexOf(odd), exp: `${odd} es «${B}»; los otros tres son «${A}». ${s.exp}`, xp: 12 });
  }
  return out;
}
const genInter = n => shuffle(INTERACTIONS).slice(0, n).map(x => { const opts = shuffle(x.o); return { type: "mcq", label: "Interacción peligrosa", prompt: "¿Qué riesgo tiene esta combinación?", sub: `${x.a}  +  ${x.b}`, opts, ans: opts.indexOf(x.o[0]), exp: x.exp, xp: 12 }; });
const genRx = n => shuffle(RX_ERRORS).slice(0, n).map(x => { const opts = shuffle(x.o); return { type: "mcq", label: "Detecta el error", prompt: "¿Qué está mal en esta indicación?", sub: x.rx, opts, ans: opts.indexOf(x.o[x.a]), exp: x.exp, xp: 15 }; });
const genCalc = n => shuffle(CALC).slice(0, n).map(fn => { const w = 50 + 5 * Math.floor(rnd() * 11), c = fn(w); return { type: "num", label: "Cálculo de dosis", prompt: c.q, numAns: c.ans, unit: c.unit, tol: c.tol === 0 ? 0 : 0.05, exp: c.exp, xp: 20 }; });

// ---------- motor de preguntas ----------
const fmtT = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;
function startQuiz(cfg) {
  clearInterval(TICK); if (G && G.cleanup) G.cleanup();
  G = Object.assign({ draw: drawQuiz, i: -1, ok: 0, n: 0, xp: 0, lives: 5, combo: 0, log: [], feedback: true, mul: 1 }, cfg);
  if (G.qs && !G.qs.length) { G = null; toast("No hay preguntas disponibles para este modo"); return render(); }
  if (G.secs) { G.left = G.secs; TICK = setInterval(() => { if (!G || !G.secs) return clearInterval(TICK); G.left--; const t = $("#timer"); if (t) t.textContent = fmtT(G.left); if (G.left <= 0) endQuiz(); }, 1000); }
  nextQ();
}
function nextQ() {
  G.i++;
  if (G.qs) { if (G.i >= G.qs.length) return endQuiz(); G.q = G.qs[G.i]; } else G.q = G.next();
  G.done = false; G.clue = 1; G.given = null; render();
  const inp = $("#ansIn"); if (inp) inp.focus();
}
function gameHead() {
  const pct = G.qs ? Math.round(G.i / G.qs.length * 100) : 100;
  return `<div class="gh"><button class="x" data-act="quit" aria-label="Salir">✕</button><div class="bar"><i style="width:${pct}%"></i></div>${G.secs ? `<span class="timer" id="timer">${fmtT(G.left)}</span>` : ""}${isFinite(G.lives) ? `<span class="hearts">❤️ ${G.lives}</span>` : ""}<span class="chip ${G.qs ? "" : "g"}">${G.qs ? `${Math.min(G.i + 1, G.qs.length)} / ${G.qs.length}` : `${G.ok} aciertos`}</span></div>`;
}
function drawQuiz() {
  const q = G.q; let h = gameHead() + `<div class="qlabel">${esc(G.title)} · ${esc(q.label)}</div><h2 class="qtext">${esc(q.prompt)}</h2>`;
  if (q.type === "quien" || q.type === "fill") h += `<dl class="kv qsub">${q.clues.slice(0, q.type === "quien" ? G.clue : 9).map(c => `<dt>${c[0]}</dt><dd>${esc(c[1])}</dd>`).join("")}</dl>`;
  else if (q.sub) h += `<div class="qsub">${esc(q.sub)}</div>`;
  if (q.type === "mcq" || q.type === "quien") {
    h += `<div class="opts">` + q.opts.map((o, i) => { let c = ""; if (G.done && G.feedback) c = i === q.ans ? "ok" : (i === G.given ? "bad" : ""); else if (G.done && i === G.given) c = "sel"; return `<button class="opt ${c}" data-act="ans" data-i="${i}" ${G.done ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`; }).join("") + `</div>`;
    if (q.type === "quien" && !G.done && G.clue < q.clues.length) h += `<div class="row"><button class="btn sec sm" data-act="clue">Otra pista (−4 XP)</button><span class="note">Pista ${G.clue} de ${q.clues.length}</span></div>`;
  } else if (q.type === "tf") {
    const c = v => G.done && G.feedback ? (q.ans === v ? "ok" : (G.given === v ? "bad" : "")) : "";
    h += `<div class="tf"><button class="opt ${c(true)}" data-act="tf" data-v="1" ${G.done ? "disabled" : ""}>Verdadero</button><button class="opt ${c(false)}" data-act="tf" data-v="0" ${G.done ? "disabled" : ""}>Falso</button></div>`;
  } else {
    h += `<div class="inrow"><input class="txt" id="ansIn" ${q.type === "num" ? 'inputmode="decimal" placeholder="Escribe el número"' : 'placeholder="Nombre del fármaco"'} autocomplete="off" autocapitalize="off" spellcheck="false" ${G.done ? "disabled" : ""} value="${G.done ? esc(G.given || "") : ""}">${q.unit ? `<span class="pill">${esc(q.unit)}</span>` : ""}<button class="btn blue" data-act="check" ${G.done ? "disabled" : ""}>Comprobar</button></div>`;
  }
  if (G.done && G.feedback) h += feedbackHtml(q, G.lastOk);
  $("#view").innerHTML = h;
}
function feedbackHtml(q, ok) {
  const titles = ok ? ["¡Correcto!", "¡Bien hecho!", "¡Exacto!"] : ["Incorrecto", "No es esa", "Casi"];
  let h = `<div class="fb ${ok ? "ok" : "bad"}" id="fb"><h3>${ok ? "✅" : "❌"} ${pick(titles)}${ok && G.lastXp ? ` <span class="chip y">+${G.lastXp} XP</span>` : ""}</h3>`;
  const right = q.type === "tf" ? (q.ans ? "Verdadero" : "Falso") : q.type === "num" ? `${f2(q.numAns)} ${q.unit}` : q.type === "fill" ? q.answer : q.opts[q.ans];
  if (!ok || q.rev || q.type === "quien") h += `<p><b>Respuesta correcta:</b> ${esc(right)}</p>`;
  if (q.exp) h += `<p>${esc(q.exp)}</p>`;
  const d = q.d;
  if (d) h += `<dl class="kv"><dt>Grupo</dt><dd>${esc(d.g)}</dd><dt>Mecanismo</dt><dd>${esc(d.ma)}</dd><dt>${esc(d.dos[0][0])}</dt><dd>${esc(d.dos[0][1])}</dd><dt>Rasgo</dt><dd>${esc(d.sig)}</dd></dl><div class="pearl">💡 ${esc(d.perla)}</div>`;
  h += `<div class="row"><button class="btn" data-act="next" id="nextBtn">Continuar</button>${d ? `<button class="btn sec sm" data-act="ficha" data-id="${d.id}">Ver ficha</button><button class="btn sec sm" data-act="ai" data-id="${d.id}">Explicar con IA</button>` : ""}</div><div id="aiOut"></div></div>`;

  if (out.length < n) for (const d of shuffle(DB)) { if (out.length >= n) break; if (d.dup || out.includes(d) || (maxLen && d[k].length > maxLen) || out.some(o => similar(o[k], d[k]))) continue; out.push(d); }
  return out;
}

  $("#view").innerHTML = `<div class="gh"><button class="x" data-act="quit" aria-label="Volver">✕</button><div class="hd" style="flex:1"><h1>Casos clínicos</h1></div></div><p class="note" style="font-size:14px">Cada decisión cambia el desenlace. Óptima: 2 puntos. Aceptable: 1. Peligrosa: 0.</p>
  <div class="clist">${CASES.map((c, i) => { const b = P.cases[c.id]; return `<button class="citem" data-act="case" data-id="${c.id}"><span class="mono" style="color:var(--muted)">${String(i + 1).padStart(2, "0")}</span><span class="tt">${esc(c.t)}<small>${esc(c.tag)} · ${c.s.length} decisiones</small></span>${b == null ? `<span class="chip">Nuevo</span>` : `<span class="chip ${b >= 1 ? "g" : b >= 0.5 ? "y" : "r"}">${Math.round(b * 100)} %</span>`}</button>`; }).join("")}</div>`;
}
function startCase(id) {
  const c = CASES.find(x => x.id === id);
  G = { draw: drawCase, title: "Caso: " + c.t, c, si: 0, score: 0, xp: 0, sel: null, opts: shuffle(c.s[0].o), log: [] }; render();
}
function drawCase() {
  const c = G.c, st = c.s[G.si], cls = s => s === 2 ? "ok" : s === 1 ? "mid" : "bad";
  let h = `<div class="gh"><button class="x" data-act="quit" aria-label="Salir">✕</button><div class="bar"><i style="width:${Math.round(G.si / c.s.length * 100)}%"></i></div><span class="chip p">Decisión ${G.si + 1} / ${c.s.length}</span></div>
  <div class="qlabel">Caso clínico · ${esc(c.tag)}</div><div class="vig">${esc(c.v)}</div><h2 class="qtext">${esc(st.q)}</h2>
  <div class="opts">${G.opts.map((o, i) => `<button class="opt ${G.sel != null ? (i === G.sel ? cls(o[1]) : (o[1] === 2 ? "ok" : "")) : ""}" data-act="cOpt" data-i="${i}" ${G.sel != null ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(o[0])}</span></button>`).join("")}</div>`;
  if (G.sel != null) {
    const o = G.opts[G.sel], best = G.opts.filter(x => x[1] === 2 && x !== o);
    h += `<div class="fb ${o[1] === 2 ? "ok" : "bad"}" id="fb"><h3>${o[1] === 2 ? "✅ Decisión óptima" : o[1] === 1 ? "🟡 Aceptable, pero hay una mejor" : "❌ Decisión peligrosa"}</h3><p>${esc(o[2])}</p>${o[1] < 2 ? best.map(b => `<p><b>Óptima:</b> ${esc(b[0])}. ${esc(b[2])}</p>`).join("") : ""}<div class="row"><button class="btn" data-act="cNext" id="nextBtn">${G.si + 1 < c.s.length ? "Siguiente decisión" : "Ver resultado"}</button></div></div>`;
  }
  $("#view").innerHTML = h;
}
function caseNext() {
  const c = G.c; G.si++;
  if (G.si < c.s.length) { G.sel = null; G.opts = shuffle(c.s[G.si].o); return render(); }
  const max = c.s.length * 2, pct = G.score / max; P.cases[c.id] = Math.max(P.cases[c.id] || 0, pct);
  showResults({ ok: G.score, n: max, xp: G.xp, log: [], title: G.title, head: pct >= 1 ? "Manejo impecable" : pct >= 0.5 ? "Paciente estable" : "Evento adverso", icon: pct >= 1 ? "🏆" : pct >= 0.5 ? "🩺" : "🚑", again: () => startCase(c.id), more: ["casos", "Más casos"], extra: [] });
}

// ---------- Flashcards ----------
function startFlash() {
  const t = today(), deck = [...pool()].map(d => ({ d, c: P.cards[d.id + "|fc"] || [0, 0] })).filter(x => x.c[1] <= t).sort((a, b) => a.c[0] - b.c[0] || rnd() - 0.5).slice(0, 15).map(x => x.d);
  if (!deck.length) return toast("No hay tarjetas pendientes hoy en esta categoría");
  G = { draw: drawFlash, title: "Flashcards", deck, i: 0, open: false, ok: 0, n: 0, xp: 0, log: [] }; render();
}
function drawFlash() {
  const d = G.deck[G.i];
  $("#view").innerHTML = `<div class="gh"><button class="x" data-act="quit" aria-label="Salir">✕</button><div class="bar"><i style="width:${Math.round(G.i / G.deck.length * 100)}%"></i></div><span class="chip">${G.i + 1} / ${G.deck.length}</span></div>
  ${G.open ? `<div class="fc open"><div class="nm">${esc(d.n)}</div><dl class="kv"><dt>Grupo</dt><dd>${esc(d.g)}</dd><dt>Familia</dt><dd>${esc(d.f)}</dd><dt>Mecanismo</dt><dd>${esc(d.ma)}</dd>${d.dos.slice(0, 3).map(x => `<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}<dt>Rasgo</dt><dd>${esc(d.sig)}</dd><dt>Contraindicaciones</dt><dd>${esc(d.ci)}</dd></dl><div class="pearl">💡 ${esc(d.perla)}</div></div>
  <div class="rate"><button data-act="fcR" data-r="0" style="color:var(--red)">Otra vez<br><small>hoy</small></button><button data-act="fcR" data-r="1" style="color:var(--orange)">Difícil<br><small>mañana</small></button><button data-act="fcR" data-r="2" style="color:var(--accent)">Bien<br><small>siguiente caja</small></button><button data-act="fcR" data-r="3" style="color:var(--blue)">Fácil<br><small>salta una caja</small></button></div><div class="row"><button class="btn sec sm" data-act="ficha" data-id="${d.id}">Ficha completa</button></div>`
  : `<button class="fc" data-act="fcOpen"><div class="note">${esc(catOf(d.c).name)}</div><div class="nm">${esc(d.n)}</div><div class="note" style="font-size:14px">Recuerda grupo, mecanismo, dosis, rasgo y contraindicaciones. Toca para comprobar.</div></button>`}`;
}
function flashRate(r) {
  const d = G.deck[G.i], key = d.id + "|fc", c = P.cards[key] || [0, 0], t = today();
  if (r === 0) { c[0] = 1; c[1] = t; G.deck.push(d); } else if (r === 1) { c[0] = Math.max(1, c[0]); c[1] = t + 1; } else { c[0] = Math.min(5, c[0] + (r === 3 ? 2 : 1)); c[1] = t + IV[c[0]]; }
  P.cards[key] = c; G.n++; if (r >= 2) G.ok++; P.xp += 3; G.xp += 3; touchStreak(); save();
  G.i++; G.open = false;
  if (G.i >= G.deck.length || G.i >= 30) return showResults({ ok: G.ok, n: G.n, xp: G.xp, log: [], title: "Flashcards", again: startFlash, extra: [] });
  render();
}

// ---------- Explicación con IA ----------
async function explainAI(id) {
  const d = BYID[id], out = document.querySelectorAll("#aiOut"); const el = out[out.length - 1]; if (!el) return;
  el.className = "ai"; el.textContent = "Pensando…";
  let sample = null; try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) {}
  if (!sample) { el.textContent = window.AQ_WEB ? "La explicación con IA no está disponible en la versión web. Usa la ficha completa del fármaco." : "La explicación con IA funciona al abrir el juego dentro de Claude con la sesión iniciada."; return; }
  const q = G && G.q ? `\nPregunta que el estudiante acaba de responder: ${G.q.prompt} ${G.q.sub || ""}` : "";
  const prompt = `Eres anestesiólogo docente. Explica en español, en 5 o 6 oraciones de texto corrido y sin listas, lo esencial de este fármaco para un residente: por qué importa en quirófano, una situación clínica concreta donde sea clave y una mnemotecnia si ayuda. Usa solo los datos de la ficha; si añades algo que no está en ella, dilo.\n\nFICHA\nFármaco: ${d.n}\nGrupo: ${d.g}\nFamilia: ${d.f}\nMecanismo: ${d.ma}\nDosis: ${d.dosis}\nFarmacocinética: ${d.pk}\nFarmacodinamia: ${d.pd}\nContraindicaciones: ${d.ci}\nEfectos adversos: ${d.ea}\nInteracciones: ${d.int}\nActualizaciones: ${d.act}${q}`;
  try { const r = await sample(prompt, { onText: ({ text }) => { el.textContent = text; } }); el.textContent = r.text + "\n\nGenerado por IA: puede contener errores. Contrasta con la ficha."; }
  catch (e) { el.textContent = e && e.code === "not_granted" ? "No se concedió el permiso para usar la IA en esta página." : e && e.code === "rate_limited" ? "Demasiadas solicitudes seguidas. Espera un momento e inténtalo de nuevo." : "No se pudo generar la explicación. Inténtalo de nuevo."; }
}

// ---------- eventos ----------

const ACT = {
  cat: e => { V.cat = e.id; render(); window.scrollTo(0, 0); },
  goCat: e => { V.cat = e.id; V.tab = "jugar"; render(); window.scrollTo(0, 0); },
  snd: () => SND.toggle(),
  mode: e => MODES[e.id].go(), daily: startDaily, repaso: startRepaso, quit, home: quit,
  again: () => { const a = G.again; if (a) a(); },
  ans: e => { const i = +e.i, q = G.q; resolve(i === q.ans, i); },
  tf: e => { const v = e.v === "1"; resolve(v === G.q.ans, v); },
  check: () => { const inp = $("#ansIn"), q = G.q, val = inp.value.trim(); if (!val) return inp.focus();
    if (q.type === "num") { const x = parseFloat(val.replace(",", ".")); if (isNaN(x)) return toast("Escribe solo el número"); resolve(Math.abs(x - q.numAns) <= Math.max(q.tol * Math.abs(q.numAns), 0.011), val); }
    else resolve(typedOk(val, q.accept), val); },
  clue: () => { G.clue++; render(); },

  mL: e => { G.m.sel = e.id; G.m.bad = null; render(); }, mR: e => matchPick(e.id),

  oNext: () => { G.si++; if (G.si >= G.sets.length) return showResults({ ok: G.ok, n: G.n, xp: G.xp, log: [], title: "Ordenar", again: startOrd, extra: [] }); ordLoad(); },
  case: e => startCase(e.id),
  cOpt: e => { if (G.sel != null) return; G.sel = +e.i; const s = G.opts[G.sel][1]; G.score += s; const xp = s * 15; P.xp += xp; G.xp += xp; P.st.a++; if (s === 2) P.st.c++; touchStreak(); save(); render(); const b = $("#nextBtn"); if (b) b.focus(); },

  reset2: () => { P = DEF(); save(); render(); toast("Progreso reiniciado"); }, resetNo: () => render()
};

  if (ev.target.id === "ov") return closeOv();

  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset);

document.addEventListener("input", ev => { if (ev.target.id === "fq") { V.fq = ev.target.value; paintDrugList(); } });

  if (t.id === "fcat") { V.fcat = t.value; paintDrugList(); } else if (t.id === "fpr") { V.fpr = t.value; paintDrugList(); }

  if (/^[1-4]$/.test(ev.key)) { const b = document.querySelector(`.opts .opt[data-i="${+ev.key - 1}"]:not([disabled])`); if (b) b.click(); }

const h0 = (location.hash || "").slice(1); if (["jugar", "fichas", "progreso", "receptores"].includes(h0)) V.tab = h0;
// ===================== Receptores, proteínas G y enzimas =====================

const RQN = { msel: 6, emp: 3, fill: 8, tf: 8, mcq: 8, intr: 6, ord: 4 };
const sampleN = (a, n) => shuffle(a).slice(0, n);
const uniqA = a => [...new Set(a)];
const GPC = ["Gs", "Gi", "Gq"];
const GPHR = { Gs: "acoplados a Gs (↑cAMP)", Gi: "acoplados a Gi/o (↓cAMP)", Gq: "acoplados a Gq/11 (PLC)", Ion: "canales iónicos (ionotrópicos)" };

function gMsel() {
  if (rnd() < 0.5) {
    const g = pick(["Gs", "Gi", "Gq", "Ion"]);
    const yes = RECS.filter(r => r.g === g), no = RECS.filter(r => r.g !== g);
    const nC = Math.min(yes.length, pick([2, 3]));
    if (nC < 2) return null;
    const C = sampleN(yes, nC), W = sampleN(no, 6 - nC);
    const opts = shuffle([...C.map(r => r.n), ...W.map(r => r.n)]);
    const ans = opts.map((o, i) => (C.some(r => r.n === o) ? i : -1)).filter(i => i >= 0);
    return { type: "msel", prompt: `Selecciona TODOS los receptores ${GPHR[g]}`, sub: "", opts, ans, answer: C.map(r => r.n).join(", "), exp: C.map(r => `${r.n}: ${RG[r.g].n}`).join(". ") + ".", ents: [...C, ...W] };
  }
  const r = pick(RECS.filter(x => x.ant.length >= 2));
  const C = sampleN(r.ant, Math.min(3, r.ant.length));
  const pool = uniqA(RECS.filter(x => x !== r).flatMap(x => x.ago)).filter(a => !r.ant.includes(a) && !r.ago.includes(a));
  const W = sampleN(pool, 6 - C.length);
  const opts = shuffle([...C, ...W]);
  const ans = opts.map((o, i) => (C.includes(o) ? i : -1)).filter(i => i >= 0);
  return { type: "msel", prompt: `Selecciona TODOS los antagonistas del receptor ${r.n}`, sub: "Marca solo los fármacos que bloquean ese receptor.", opts, ans, answer: C.join(", "), exp: `${r.n}: ${r.sec}.`, ents: [r] };
}

function gEmp() {
  const set = pick(["A", "A", "B", "C"]);
  let pairs, prompt, ents;
  if (set === "A") { const objs = sampleN(RECS.filter(r => r.ref), 5); pairs = objs.map(r => [r.n, r.ref]); ents = objs; prompt = "Une cada receptor con su fármaco de referencia"; }
  else if (set === "B") { pairs = [["Proteína Gs", "Adenilato ciclasa (↑cAMP)"], ["Proteína Gi/o", "Adenilato ciclasa (↓cAMP)"], ["Proteína Gq/11", "Fosfolipasa C-β (IP3 y DAG)"], ["Proteína Go", "Canales de Ca²⁺ y K⁺ neuronales"]]; ents = ["Gs", "Gi", "Gq", "Go"].map(pk => ({ pk })); prompt = "Une cada proteína G con su efector"; }
  else { const objs = ENZ.filter(e => e.ref); pairs = objs.map(e => [e.n, e.ref]); ents = objs; prompt = "Une cada enzima con su fármaco de referencia"; }
  const order = shuffle(pairs.map((_, i) => i));
  const right = order.map(i => pairs[i][1]);
  const map = pairs.map((_, i) => order.indexOf(i));
  return { type: "emp", prompt, sub: "", left: pairs.map(p => p[0]), right, map, answer: pairs.map(p => `${p[0]} → ${p[1]}`).join("; "), exp: "", ents };
}

function gFill() {
  const t = rnd();
  if (t < 0.4) {
    const r = pick(RECS.filter(x => GPC.includes(x.g)));
    const acc = { Gs: ["gs"], Gi: ["gi", "go", "gi o", "gi o go"], Gq: ["gq", "gq 11", "gq11"] }[r.g].map(norm);
    return { type: "fill", prompt: `El receptor ${r.n} se acopla principalmente a la proteína ____`, sub: "", accept: acc, answer: RG[r.g].n, exp: RG[r.g].fx, ents: [r] };
  }
  if (t < 0.75) {
    const r = pick(RECS.filter(x => x.ref));
    return { type: "fill", prompt: `Completa: el blanco principal de ${r.ref} es el receptor ____`, sub: "", accept: uniqA([...r.k, r.n].map(norm)), answer: r.n, exp: r.sec, ents: [r] };
  }
  const e = pick(ENZ.filter(x => x.ac));
  return { type: "fill", prompt: `Completa: la enzima que ${e.fn} es la ____`, sub: "", accept: e.ac.map(norm), answer: e.n, exp: e.reg, ents: [e] };
}

function gTf() {
  const t = rnd();
  if (t < 0.35) { const [s, a, e] = pick(RTF_BANK); return { type: "tf", prompt: s, sub: "", ans: a, answer: a ? "Verdadero" : "Falso", exp: e, ents: [] }; }
  if (t < 0.7) {
    const r = pick(RECS.filter(x => GPC.includes(x.g)));
    const truth = rnd() < 0.5;
    const gl = truth ? r.g : pick(GPC.filter(k => k !== r.g));
    return { type: "tf", prompt: `${r.n} se acopla a la proteína ${RG[gl].n}`, sub: "", ans: truth, answer: truth ? "Verdadero" : "Falso", exp: `${r.n}: ${RG[r.g].n}. ${r.sec}.`, ents: [r] };
  }
  const r = pick(RECS);
  const truth = r.g === "Ion";
  return { type: "tf", prompt: `${r.n} es un canal iónico`, sub: "", ans: truth, answer: truth ? "Verdadero" : "Falso", exp: `${r.n} pertenece a: ${RG[r.g].n}. ${RG[r.g].fx}.`, ents: [r] };
}

function gMcq() {
  const t = rnd();
  if (t < 0.4) {
    const r = pick(RECS.filter(x => x.ref));
    const others = sampleN(RECS.filter(x => x !== r), 3).map(x => x.n);
    const opts = shuffle([r.n, ...others]);
    return { type: "mcq", prompt: `¿Cuál es el receptor principal de ${r.ref}?`, sub: "", opts, ans: opts.indexOf(r.n), answer: r.n, exp: `${r.n}: ${r.sec}.`, ents: [r] };
  }
  if (t < 0.75) {
    const r = pick(RECS);
    const labels = ["Gs", "Gi", "Gq", "Ion", "TK", "Nuc"].map(k => RG[k].n);
    const correct = RG[r.g].n;
    const opts = shuffle([correct, ...sampleN(labels.filter(l => l !== correct), 3)]);
    return { type: "mcq", prompt: `¿Qué tipo de proteína G o de receptor es ${r.n}?`, sub: "", opts, ans: opts.indexOf(correct), answer: correct, exp: RG[r.g].fx, ents: [r] };
  }
  const e = pick(ENZ);
  const others = sampleN(ENZ.filter(x => x !== e), 3).map(x => x.n);
  const opts = shuffle([e.n, ...others]);
  return { type: "mcq", prompt: `¿Qué enzima ${e.fn}?`, sub: "", opts, ans: opts.indexOf(e.n), answer: e.n, exp: e.reg, ents: [e] };
}

function gIntr() {
  const grp = pick(["Gi", "Gq", "Gs", "Ion"]);
  const C = sampleN(RECS.filter(r => r.g === grp), 3);
  const odd = pick(RECS.filter(r => r.g !== grp));
  const opts = shuffle([...C.map(r => r.n), odd.n]);
  return { type: "mcq", prompt: `¿Cuál NO pertenece al grupo de ${RG[grp].n}?`, sub: "", opts, ans: opts.indexOf(odd.n), answer: odd.n, exp: `${odd.n} pertenece a ${RG[odd.g].n}: ${odd.sec}.`, ents: [...C, odd] };
}

function gOrd() {
  const c = pick(CHAINS);
  const shown = shuffle(c.steps.map((_, i) => i));
  return { type: "ord", prompt: `Ordena la cadena de señalización del ${c.name}`, sub: "", steps: c.steps, shown, answer: c.steps.join(" → "), exp: c.exp, ents: [RECS.find(r => r.id === c.rid)].filter(Boolean) };
}

function genRound(mode) {
  const gen = { msel: gMsel, emp: gEmp, fill: gFill, tf: gTf, mcq: gMcq, intr: gIntr, ord: gOrd }[mode];
  const out = []; let guard = 0;
  while (out.length < RQN[mode] && guard++ < 300) { const q = gen(); if (q) out.push(q); }
  return out;
}

function boardHtml() {
  const ps = players().sort((a, b) => b.s - a.s);
  return ps.map((p, r) => `<div class="brow ${p.me ? "me" : ""}"><span class="mono">${r + 1}</span><span class="bn">${p.bot ? "🤖 " : ""}${esc(p.name)}${p.me ? ' <span class="chip g">tú</span>' : ""}${p.host && G.stage === "room" ? ' <span class="chip p">anfitrión</span>' : ""}${p.idle ? ' <span class="chip">en sala</span>' : ""}</span>${G.stage === "room" ? "" : `<span class="bp">${p.d ? "✓ fin" : `${Math.min(p.i, G.n)}/${G.n}`}</span><span class="bs mono">${p.s}</span>`}</div>`).join("");
}
function tickDuel() {
  if (!G || G.draw !== drawDuel) return clearInterval(duelTick);
  const now = Date.now();
  if (G.stage === "count") {
    if (now >= G.t0) { G.stage = "play"; G.qEnd = now + QSEC * 1000; G.ans = null; SND.go(); SND.setMusic(true); render(); }
    else { const left = Math.ceil((G.t0 - now) / 1000), c = $("#dCount"); if (c && c.dataset.v !== String(left)) { c.dataset.v = String(left); c.innerHTML = `<span class="cnum">${left}</span>`; SND.tick(); } }
    return;
  }
  let ch = false;
  if (!G.room || G.host) G.bots.forEach(b => {
    if (b.d || now < b.next) return;
    const ok = Math.random() < BOT_LV[b.lvl][1];
    if (ok) b.s += 100 + Math.round(50 * Math.max(0, QSEC - b.dt / 1000) / QSEC);
    if (G.stage === "play") SND.opp(ok, true);
    b.i++; if (b.i >= G.n) b.d = true; else { b.dt = botDelay(b); b.next += b.dt; } ch = true;
  });
  if (ch) publish();
  if (G.stage === "play") {
    const left = Math.ceil((G.qEnd - now) / 1000), c = $("#dClock");
    if (c) { c.textContent = fmtT(Math.max(0, left)); c.classList.toggle("hot", left <= 5 && left > 0 && G.ans == null); }
    if (left <= 0 && G.ans == null) duelAnswer(-1);
  }
  const bd = $("#dBoard"); if (bd) bd.innerHTML = boardHtml();
  if (G.stage === "end") {
    const ps = players().filter(p => !p.idle), all = ps.every(p => p.d), w = $("#dWait");
    if (w) w.textContent = all ? "" : "Esperando a que terminen: " + ps.filter(p => !p.d).map(p => p.name).join(", ");
    if (all && !G.won) {
      G.won = true; const top = Math.max(...ps.map(p => p.s));
      if (ps.length > 1 && (G.score || 0) === top) { P.xp += 50; P.duel = P.duel || { p: 0, w: 0 }; P.duel.w++; save(); toast("🏆 Ganaste el duelo: +50 XP"); SND.win(); confetti(); checkBadges(); save(); }
      else SND.lose();
      render();
    }
  }
}
function confetti() {
  const box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
  const cols = ["#58cc02", "#ffc800", "#1cb0f6", "#ce82ff", "#ff4b4b", "#ff9600"];
  for (let i = 0; i < 90; i++) {
    const e = document.createElement("i");
    e.style.left = (Math.random() * 100) + "%"; e.style.background = cols[i % cols.length]; e.style.width = (6 + Math.random() * 6) + "px";
    e.style.setProperty("--dx", (Math.random() * 180 - 90) + "px"); e.style.setProperty("--rot", (360 + Math.random() * 720) + "deg");
    e.style.setProperty("--t", (2.2 + Math.random() * 1.8) + "s"); e.style.setProperty("--d", (Math.random() * 0.6) + "s");
    box.appendChild(e);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 5000);
}
function duelAnswer(i) {
  if (G.stage !== "play" || G.ans != null) return;
  const g = G, q = G.qs[G.i], ok = i === q.ans, left = Math.max(0, (G.qEnd - Date.now()) / 1000);
  // puntuación: 100 por acertar + hasta 50 según lo que quedara de tiempo (responder al instante = 150)
  G.ans = i; G.took = QSEC - left; G.bonus = ok ? Math.round(50 * left / QSEC) : 0;
  G.pts = ok ? 100 + G.bonus : 0; G.score += G.pts; if (ok) { G.ok++; P.st.c++; }
  G.lastA = [G.i, ok ? 1 : 0, Date.now()];
  SND.ans(ok);
  P.st.a++; touchStreak(); if (q.key) grade(q.key, ok); save(); publish(); render();
  setTimeout(() => {
    if (G !== g || G.stage !== "play") return;
    G.i++;
    if (G.i >= G.n) {
      G.stage = "end"; G.done = true; SND.setMusic(false);
      if (!G.paid) { G.paid = true; G.xp = Math.round(G.score / 10); P.xp += G.xp; P.duel = P.duel || { p: 0, w: 0 }; P.duel.p++; P.sessions++; checkBadges(); save(); }
      publish(); render(); if (G.room) onDuelPeers();
    } else { G.ans = null; G.qEnd = Date.now() + QSEC * 1000; publish(); render(); }
  }, ok ? 900 : 1700);
}
// sonido de los rivales: cada respuesta publica [pregunta, acierto, marca de tiempo]; solo sonamos cuando la marca cambia
function listenOpp() {
  G.room.peers().forEach(p => {
    if (p.isMe) return;
    const a = p.presence && p.presence.a, nonce = Array.isArray(a) ? a[2] : null;
    const prev = SEEN[p.peer]; SEEN[p.peer] = nonce;
    // primera vez que vemos al rival: solo fijamos la línea base (no sonar eventos antiguos)
    if (prev === undefined || nonce == null || nonce === prev) return;
    if (G.stage === "play") SND.opp(!!a[1], false);
  });
}
function onDuelPeers() {
  if (!G || G.draw !== drawDuel || !G.room) return;
  listenOpp();
  if (!G.host && (G.stage === "room" || G.stage === "end")) {
    const hosts = G.room.peers().filter(p => p.presence && p.presence.host && p.presence.g && !(p.isMe && p.sameTab)).sort((a, b) => a.peer < b.peer ? -1 : 1);
    const g = hosts.length ? hosts[0].presence.g : null;
    if (g && typeof g.id === "number" && g.id !== G.gid) { G.gid = g.id; return beginGame(g.seed | 0, String(g.cat), clampN(g.n)); }
  }
  if (G.stage === "room") render(); else { const bd = $("#dBoard"); if (bd) bd.innerHTML = boardHtml(); }
}
async function enterRoom(code, host) {
  const room = await getRoom();
  if (!room) return toast(window.AQ_WEB ? "No se pudo conectar con el servidor de salas. Revisa tu conexión" : "Las salas en vivo solo funcionan con el juego abierto dentro de Claude");
  if (!/^[a-z0-9]{4}$/.test(code)) return toast("El código tiene 4 letras o números");
  try {
    const nr = await room.join("aq-" + code);
    if (!G || G.draw !== drawDuel) { nr.leave().catch(() => {}); return; }
    G.room = nr; G.code = code; G.host = host; G.stage = "room"; G.gid = 0; G.bots = [];
    await nr.presence({ nick: nick(), host, s: 0, i: 0, d: false, gid: 0, g: null, b: null });
    G.unsub = nr.onPeers(onDuelPeers, () => { if (G && G.draw === drawDuel) toast("Se perdió la conexión con la sala"); });
    render();
  } catch (e) { toast(e && e.code === "not_permitted" ? "Tu cuenta no puede usar salas en esta página" : "No se pudo entrar a la sala. Inténtalo de nuevo"); }
}
function hostStart() {
  const id = Date.now(), seed = Math.floor(Math.random() * 1e9), cat = V.cat, n = DU.n;
  G.gid = id; G.bots = mkBots(DU.rbots, DU.lvl);
  G.room.presence({ g: { id, seed, cat, n } }).catch(() => {});
  beginGame(seed, cat, n);
}
function drawDuel() {
  const c = catOf(G.cat || V.cat), catName = c ? c.name : "Todas las categorías";
  const head = t => `<div class="gh"><button class="x" data-act="quit" aria-label="Salir">✕</button><div class="hd" style="flex:1"><h1>${t}</h1></div>${G.code ? `<span class="chip p mono" style="font-size:14px">Sala ${G.code.toUpperCase()}</span>` : ""}</div>`;
  const sel = (id, val, opts) => `<select id="${id}" class="dsel">${opts.map(o => `<option value="${o[0]}" ${String(o[0]) === String(val) ? "selected" : ""}>${o[1]}</option>`).join("")}</select>`;
  const lvls = BOT_LV.map((l, i) => [i, l[0]]), ns = [[5, "5 preguntas"], [10, "10 preguntas"], [15, "15 preguntas"]];
  let h = "";
  if (G.stage === "lobby") {
    h = head("⚔️ Duelo") + `<p class="note" style="font-size:14px">Todos reciben las mismas preguntas de <b>${esc(catName)}</b>. ${QSEC} segundos por pregunta: acertar da 100 puntos y hasta 50 más por rapidez.</p>
    <div class="row"><label for="nick" style="font-weight:800">Tu nombre</label><input id="nick" class="txt" maxlength="16" placeholder="Cómo te verán los demás" value="${esc(P.nick || "")}" autocomplete="off" style="max-width:280px">${sel("dN", DU.n, ns)}</div>
    <div class="hero"><div class="fsec"><h3>Contra bots</h3><p>Rivales simulados que responden a su ritmo.</p><div class="row" style="margin-top:10px">${sel("dBots", DU.bots, [[1, "1 bot"], [2, "2 bots"], [3, "3 bots"]])}${sel("dLvl", DU.lvl, lvls)}</div><div class="row" style="margin-top:12px"><button class="btn" data-act="dBots">Jugar contra bots</button></div></div>
    <div class="fsec"><h3>Contra compañeros</h3><p>Crea una sala y pasa el código, o entra con el código que te dieron.</p><div class="row" style="margin-top:10px"><button class="btn blue" data-act="dCreate">Crear sala</button></div><div class="row" style="margin-top:10px"><input id="dCode" class="txt mono" maxlength="4" placeholder="Código" autocomplete="off" autocapitalize="characters" style="max-width:130px;min-width:110px;text-transform:uppercase"><button class="btn sec" data-act="dJoin">Unirse</button></div><p class="note" style="margin-top:10px">${window.AQ_WEB ? "Pásales el enlace de esta página y el código de la sala. No hace falta cuenta." : "Tus compañeros necesitan acceso a esta página: compártela desde el menú Compartir y abran todos el juego a la vez."}</p></div></div>`;
  } else if (G.stage === "room") {
    const n = players().filter(p => !p.bot).length;
    h = head("Sala de espera") + `<div class="fsec" style="text-align:center"><h3>Código de la sala</h3><div class="mono" style="font-size:44px;font-weight:500;letter-spacing:8px;color:var(--gold)">${G.code.toUpperCase()}</div><p class="note">Compártelo con tus compañeros. Entran desde Duelo → Unirse.</p></div>
    <div class="sec-title">Jugadores conectados (${n})</div><div class="board" id="dBoard">${boardHtml()}</div>
    ${G.host ? `<div class="row">${sel("dN", DU.n, ns)}${sel("dRB", DU.rbots, [[0, "Sin bots"], [1, "Añadir 1 bot"], [2, "Añadir 2 bots"]])}${sel("dLvl", DU.lvl, lvls)}</div><div class="row"><button class="btn" data-act="dStart">Empezar duelo</button><span class="note">Categoría: ${esc(catName)}. Puedes empezar solo o esperar a que entren más.</span></div>` : `<p class="note" style="font-size:15px">Esperando a que el anfitrión empiece el duelo…</p>`}`;
  } else if (G.stage === "count") {
    h = head("⚔️ Duelo") + `<div class="res"><p class="note" style="font-size:15px">${G.n} preguntas · ${esc(catName)}</p><div class="tr mono" id="dCount" style="font-size:96px;color:var(--gold);min-height:1em">3</div><h1>Prepárate</h1></div><div class="board" id="dBoard">${boardHtml()}</div>`;
  } else if (G.stage === "play") {
    const q = G.qs[G.i], done = G.ans != null;
    h = `<div class="gh"><button class="x" data-act="quit" aria-label="Salir">✕</button><div class="bar"><i style="width:${Math.round(G.i / G.n * 100)}%"></i></div><span class="timer" id="dClock">${fmtT(Math.ceil((G.qEnd - Date.now()) / 1000))}</span><span class="chip">${G.i + 1} / ${G.n}</span><span class="chip y mono">${G.score}</span></div>
    <div class="qlabel">Duelo · ${esc(q.label)}</div><h2 class="qtext">${esc(q.prompt)}</h2>${q.sub ? `<div class="qsub">${esc(q.sub)}</div>` : ""}
    <div class="opts">${q.opts.map((o, i) => `<button class="opt ${done ? (i === q.ans ? "ok" : i === G.ans ? "bad" : "") : ""}" data-act="dAns" data-i="${i}" ${done ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${done ? `<div class="fbw"><div class="ptsfloat ${G.pts ? "" : "zero"}">${G.pts ? "+" + G.pts : G.ans === -1 ? "⏱" : "✗"}</div></div><p class="note" style="font-size:15px;font-weight:800;color:${G.pts ? "var(--accent)" : "var(--red)"}">${G.pts ? `Acierto en ${G.took.toFixed(1)} s: 100 base + ${G.bonus} de rapidez. Cuanto antes respondas, más puntos.` : G.ans === -1 ? "Se acabó el tiempo (0 puntos)" : "Incorrecto (0 puntos)"}</p>` : ""}
    <div class="board compact" id="dBoard">${boardHtml()}</div>`;
  } else {
    const ps = players().filter(p => !p.idle).sort((a, b) => b.s - a.s), pos = ps.findIndex(p => p.me) + 1, all = ps.every(p => p.d);
    h = head("Resultado del duelo") + `<div class="res"><div class="tr">${all && pos === 1 && ps.length > 1 ? "🏆" : pos <= 2 ? "🥈" : "🩺"}</div><h1>${all ? `Quedaste ${pos}.º de ${ps.length}` : `Vas ${pos}.º de ${ps.length}`}</h1><p class="note" id="dWait" style="font-size:14px"></p>
    <div class="tiles"><div class="tile"><b style="color:var(--gold)">${G.score}</b><span>Puntos</span></div><div class="tile"><b style="color:var(--accent)">${G.ok} / ${G.n}</b><span>Correctas</span></div><div class="tile"><b style="color:var(--blue)">+${(G.xp || 0) + (G.won && pos === 1 && ps.length > 1 ? 50 : 0)}</b><span>XP ganados</span></div></div></div>
    <div class="board" id="dBoard">${boardHtml()}</div>
    <div class="rev"><div class="sec-title">Repasa las preguntas</div>${G.qs.map(q => `<details><summary>${esc(q.prompt)}${q.sub ? " — " + esc(q.sub.slice(0, 90)) : ""}</summary><p><b>Correcta:</b> ${esc(q.opts[q.ans])}</p>${q.d ? `<p><button class="btn sec sm" data-act="ficha" data-id="${q.d.id}">Ficha de ${esc(q.d.n)}</button></p>` : ""}</details>`).join("")}</div>
    <div class="row" style="justify-content:center">${!G.room || G.host ? `<button class="btn" data-act="dAgain">Revancha</button>` : `<span class="note">El anfitrión puede lanzar la revancha.</span>`}<button class="btn sec" data-act="quit">Salir</button></div>`;
  }
  $("#view").innerHTML = h;
}
function readDuelForm() {
  const g = id => { const e = $("#" + id); return e ? e.value : null; };
  const nk = g("nick"); if (nk != null && nk.trim() !== (P.nick || "")) { P.nick = nk.trim().slice(0, 16); save(); }
  if (g("dN") != null) DU.n = clampN(g("dN"));
  if (g("dBots") != null) DU.bots = Math.min(3, Math.max(1, +g("dBots") || 1));
  if (g("dRB") != null) DU.rbots = Math.min(2, Math.max(0, +g("dRB") || 0));
  if (g("dLvl") != null) DU.lvl = Math.min(2, Math.max(0, +g("dLvl") || 0));
}
MODES.duel = { ic: "⚔️", t: "Duelo", d: "Las mismas preguntas para todos y 20 segundos por pregunta. Juega contra bots o crea una sala con código para tus compañeros", b: "En vivo", c: "r", go: openDuel };
BADGES.push(["duel", "⚔️", "Duelista", "Gana un duelo", () => (P.duel || {}).w >= 1]);
Object.assign(ACT, {
  dBots: () => { readDuelForm(); G.bots = mkBots(DU.bots, DU.lvl); G.room = null; beginGame(Math.floor(Math.random() * 1e9), V.cat, DU.n); },
  dCreate: () => { readDuelForm(); const abc = "abcdefghjkmnpqrstuvwxyz23456789"; let c = ""; for (let i = 0; i < 4; i++) c += abc[Math.floor(Math.random() * abc.length)]; enterRoom(c, true); },
  dJoin: () => { const code = ($("#dCode").value || "").trim().toLowerCase(); readDuelForm(); enterRoom(code, false); },
  dStart: () => { readDuelForm(); hostStart(); },
  dAns: e => duelAnswer(+e.i),
  dAgain: () => { if (G.room) return hostStart(); G.bots.forEach(b => { b.lvl = DU.lvl; }); beginGame(Math.floor(Math.random() * 1e9), G.cat, G.n); }
});
document.addEventListener("change", ev => { if (G && G.draw === drawDuel && ["dN", "dBots", "dRB", "dLvl", "nick"].includes(ev.target.id)) { readDuelForm(); if (ev.target.id === "nick") publish(); } });
paintNav(); render(); initCloud(); SND.syncLabel();
</script></body></html>
